name: Update yearly contributions

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch this year's contribution count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          year=$(date -u +%Y)
          total=$(gh api graphql -f query="{user(login:\"${{ github.repository_owner }}\"){contributionsCollection(from:\"${year}-01-01T00:00:00Z\",to:\"${year}-12-31T23:59:59Z\"){contributionCalendar{totalContributions}}}}" \
            --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          mkdir -p out
          printf '{"schemaVersion":1,"label":"%s Contributions","message":"%s","color":"6DB33F"}\n' "$year" "$total" > out/contributions.json
          cat out/contributions.json

      # Written to a separate branch so these updates don't count as contributions
      - name: Publish to stats branch
        run: |
          cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          git commit -q -m "Update contributions"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" stats
